<title>Café Cantinho</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@500;600;700&family=Press+Start+2P&display=swap">
<style>
/* Layout: HUD 16 bits no topo, cena em pixel art com luz e sombra, painel de trabalho embaixo, ficha ao lado (embaixo no celular). Títulos e números em fonte pixel; textos corridos em fonte de alta legibilidade. Visual único: café à noite, roxo profundo com luz âmbar de lâmpada. */
:root{
  --fundo:#120f24; --painel:#221c3c; --painel2:#2d2650; --painel3:#1a1530; --borda:#07050f; --luz:#4b4278; --brilho:#6a5fa3;
  --texto:#f5f0e1; --suave:#b4acd6; --ouro:#ffcc4d; --ouro-esc:#3a2600;
  --verde:#72e09a; --vermelho:#ff6e6e; --azul:#72c8ff; --rosa:#ff93c9; --laranja:#ffa64d;
  --f-px:"Pixelify Sans","Courier New",monospace;
  --f-txt:"Atkinson Hyperlegible",system-ui,sans-serif;
  --f-tit:"Press Start 2P","Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--fundo);color:var(--texto);font-family:var(--f-txt);font-size:16px;line-height:1.4;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:6px 6px}
.app{max-width:1260px;margin:0 auto;padding-block:10px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.px{background:var(--painel);border:3px solid var(--borda);box-shadow:inset 0 0 0 2px var(--luz),inset 0 4px 0 2px rgba(255,255,255,.04),0 5px 0 var(--borda)}
button{font:inherit;color:inherit;cursor:pointer}
.bt{font-family:var(--f-px);background:linear-gradient(var(--painel2),#262046);border:3px solid var(--borda);box-shadow:inset 0 -4px 0 rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.14);padding:7px 14px;font-size:16px;font-weight:600;letter-spacing:.02em}
.bt:hover:not(:disabled){filter:brightness(1.18)}
.bt:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.4)}
.bt:disabled{opacity:.4;cursor:not-allowed}
.bt.ouro{background:linear-gradient(#ffd96e,#f2b62e);color:var(--ouro-esc)}
.bt.verde{background:linear-gradient(#8af0ae,#55c47e);color:#0d2a16}
.bt.verm{background:linear-gradient(#ff8a8a,#e05555);color:#2a0606}
.bt.grande{font-size:20px;padding:12px 22px}
:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}
.tecla{font-family:var(--f-px);font-size:12px;opacity:.75;margin-left:6px;font-weight:500}
.ico{width:32px;height:32px;image-rendering:pixelated;flex:none;display:inline-block;vertical-align:middle}
.ico.p{width:22px;height:22px}
.ico.g{width:44px;height:44px}
/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 14px}
.marca{font-family:var(--f-tit);font-size:13px;color:var(--ouro);line-height:1.45;margin-right:auto;text-shadow:2px 2px 0 var(--borda),0 0 12px rgba(255,204,77,.35)}
.hstat{display:flex;align-items:center;gap:6px;line-height:1.1}
.hstat div{display:flex;flex-direction:column}
.hstat small{font-family:var(--f-px);font-size:12px;color:var(--suave);text-transform:uppercase;letter-spacing:.06em}
.hstat b{font-family:var(--f-px);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.barra-rot{display:flex;align-items:center;gap:6px;font-family:var(--f-px);font-size:13px;color:var(--suave);text-transform:uppercase}
.barra{width:120px;height:18px;border:3px solid var(--borda);background:#0d0a1a;position:relative;box-shadow:inset 0 2px 0 rgba(0,0,0,.5)}
.barra i{position:absolute;inset:0 auto 0 0;display:block;transition:width .3s steps(8)}
.barra i::before{content:"";position:absolute;inset:0 0 50% 0;background:rgba(255,255,255,.28)}
.barra i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(0,0,0,.35) 9px 10px)}
/* Grade */
.grade{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:10px;align-items:start}
@media (max-width:1000px){.grade{grid-template-columns:minmax(0,1fr)}}
.coluna{display:flex;flex-direction:column;gap:10px;min-width:0}
.cena-wrap{position:relative;padding:0;overflow:hidden}
.cena-wrap.treme{animation:treme .3s steps(3)}
@keyframes treme{25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}
canvas#cena{display:block;width:100%;aspect-ratio:384/160;image-rendering:pixelated;background:#000}
.flut{position:absolute;transform:translate(-50%,0);font-family:var(--f-px);font-weight:700;font-size:clamp(14px,2.2vw,22px);text-shadow:2px 2px 0 #000,-1px -1px 0 #000;pointer-events:none;animation:sobe 1.3s ease-out forwards;white-space:nowrap;z-index:3}
.flut.grande{font-family:var(--f-tit);font-size:clamp(14px,2.6vw,26px)}
@keyframes sobe{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}30%{transform:translate(-50%,-6px) scale(1)}100%{opacity:0;transform:translate(-50%,-50px)}}
.hot{position:absolute;bottom:3%;transform:translateX(-50%);font-family:var(--f-px);background:var(--painel);border:3px solid var(--borda);box-shadow:inset 0 -3px 0 rgba(0,0,0,.4),0 3px 0 var(--borda);padding:3px 9px;font-size:clamp(11px,1.5vw,15px);font-weight:600;white-space:nowrap}
.hot.ativo{background:var(--ouro);color:var(--ouro-esc)}
.hot:disabled{opacity:.35;cursor:not-allowed}
.hot .novo{color:var(--verde);margin-left:4px}
.hot.ativo .novo{color:#1f5a2a}
.dialogo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:10px 12px}
.retrato{width:64px;height:64px;image-rendering:pixelated;border:3px solid var(--borda);background:#0d0a1a}
.quem{font-family:var(--f-px);font-weight:700;color:var(--ouro);margin-bottom:2px;font-size:17px}
.dialogo p{margin:0 0 6px;max-width:70ch}
.dialogo .acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
/* Expediente */
.trab{padding:10px;display:flex;flex-direction:column;gap:12px}
.rotulo{font-family:var(--f-px);font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--suave);margin:0 0 6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.topo-exp{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.metas{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.meta{font-size:14px;background:var(--painel3);border:3px solid var(--borda);padding:4px 8px;display:flex;align-items:center;gap:6px}
.meta b{font-family:var(--f-px);color:var(--ouro)}
.meta.ok{background:#1f4a30;color:var(--verde)}
.meta.ok b{color:var(--verde)}
.combo{font-family:var(--f-px);display:flex;align-items:center;gap:6px;background:var(--painel3);border:3px solid var(--borda);padding:2px 10px;min-width:150px}
.combo b{font-size:24px;color:var(--laranja)}
.combo.quente b{color:#ff5e3a;text-shadow:0 0 8px rgba(255,94,58,.7)}
.combo small{font-size:13px;color:var(--suave);line-height:1.1}
.tickets{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:720px){.tickets{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ticket{background:linear-gradient(#fbf6e6,#ece3c8);color:#231a10;border:3px solid var(--borda);box-shadow:0 4px 0 var(--borda),inset 0 -3px 0 rgba(0,0,0,.08);padding:6px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:112px;position:relative}
.ticket:hover{filter:brightness(1.05)}
.ticket.pronto{box-shadow:0 4px 0 var(--borda),0 0 0 3px var(--verde);animation:pulsa 1s steps(2) infinite}
@keyframes pulsa{50%{box-shadow:0 4px 0 var(--borda),0 0 0 3px transparent}}
.ticket.vazio{background:transparent;border-style:dashed;border-color:var(--luz);box-shadow:none;color:var(--suave);align-items:center;justify-content:center;font-size:14px}
.ticket .nome{font-family:var(--f-px);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticket .itens{display:flex;gap:4px;flex-wrap:wrap}
.it{position:relative;display:inline-flex;border:2px solid #231a10;background:#fff;padding:1px}
.it.ok{background:#bff0c9;opacity:.6}
.it.ok::after{content:"✓";position:absolute;right:-4px;bottom:-6px;font-weight:700;color:#1d7a3c;font-size:16px}
.it.tem{background:#ffe08a}
.pac{height:9px;border:2px solid #231a10;background:#d8d0b8;margin-top:auto}
.pac i{display:block;height:100%}
.traco{font-size:12px;font-weight:700;color:#7a2a4a}
.ticket .tag{position:absolute;top:-11px;right:4px;font-family:var(--f-px);background:var(--rosa);color:#2a0a1a;font-size:12px;padding:0 5px;border:2px solid var(--borda)}
.bancada{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:10px}
@media (max-width:780px){.bancada{grid-template-columns:minmax(0,1fr)}}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.slot{background:var(--painel2);border:3px solid var(--borda);box-shadow:inset 0 2px 0 rgba(255,255,255,.06);padding:8px;display:flex;flex-direction:column;gap:6px;min-height:168px}
.slot h5{margin:0;font-family:var(--f-px);font-size:13px;color:var(--suave);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between}
.slot .rec{font-family:var(--f-px);font-size:19px;font-weight:700;display:flex;align-items:center;gap:6px}
.etapas{display:flex;flex-wrap:wrap;gap:4px}
.etapa{font-size:12px;padding:1px 5px;border:2px solid var(--borda);background:#16122a;color:var(--suave)}
.etapa.feita{background:#22492f;color:var(--verde)}
.etapa.atual{background:var(--ouro);color:var(--ouro-esc);font-weight:700}
.prog{height:12px;border:2px solid var(--borda);background:#0d0a1a;position:relative}
.prog i{display:block;height:100%;background:var(--azul);width:0}
.prog .zona{position:absolute;top:-2px;bottom:-2px;background:rgba(114,224,154,.35);border-left:2px solid var(--verde);border-right:2px solid var(--verde)}
.prog .cursor{position:absolute;top:-4px;bottom:-4px;width:4px;background:#fff;box-shadow:0 0 0 1px #000}
.receitas{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.receitas .bt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;font-size:14px}
.slotbt{width:100%;display:flex;justify-content:space-between;align-items:center}
.estado{font-size:14px;color:var(--suave)}
.lado{display:flex;flex-direction:column;gap:8px}
.caixa-lado{background:var(--painel2);border:3px solid var(--borda);padding:8px;display:flex;flex-direction:column;gap:6px}
.bandeja{display:flex;gap:8px;flex-wrap:wrap}
.cel{width:76px;height:64px;border:3px solid var(--borda);background:linear-gradient(#6a4628,#4e321c);box-shadow:inset 0 2px 0 rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-size:11px}
.cel.vazia{background:#241810;color:#6e5c4c;box-shadow:inset 0 3px 0 rgba(0,0,0,.4)}
.cel.novo{animation:pop .35s steps(4)}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.cel .estrela{position:absolute;top:2px;left:3px;color:var(--ouro);font-size:14px;text-shadow:1px 1px 0 #000}
.cel .x{position:absolute;top:-10px;right:-10px;width:24px;height:24px;padding:0;line-height:16px;font-size:15px;background:var(--vermelho);color:#2a0606;border:2px solid var(--borda)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}
.kv b{font-family:var(--f-px);font-variant-numeric:tabular-nums;font-size:17px}
.neg{color:var(--vermelho)!important} .pos{color:var(--verde)!important}
.alvo{animation:pisca .9s steps(2) infinite;outline:4px solid var(--ouro)!important;outline-offset:2px;position:relative;z-index:2}
@keyframes pisca{50%{outline-color:transparent}}
/* Mapa */
.local{padding:12px;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px}
@media (max-width:780px){.local{grid-template-columns:minmax(0,1fr)}}
.local h2{font-family:var(--f-tit);font-size:15px;line-height:1.4;color:var(--ouro);margin:0 0 6px;text-shadow:2px 2px 0 var(--borda)}
.local .desc{color:var(--suave);margin:0 0 10px}
.acoes-lista{display:flex;flex-direction:column;gap:8px}
.acao{background:linear-gradient(var(--painel2),#272148);border:3px solid var(--borda);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35);padding:8px 10px;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:center}
.acao:hover:not(:disabled){filter:brightness(1.18)}
.acao:disabled{opacity:.45;cursor:not-allowed}
.acao b{font-family:var(--f-px);font-size:17px}
.acao .hr{grid-row:span 2;font-family:var(--f-px);font-size:16px;font-weight:700;background:var(--borda);color:var(--ouro);padding:3px 8px}
.efs{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px}
.ef-up{color:var(--verde)} .ef-dn{color:var(--vermelho)} .ef-nt{color:var(--suave)}
.req{font-size:14px;color:var(--vermelho);grid-column:1/-1}
.hoje{background:var(--painel3);border:3px solid var(--borda);padding:10px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.hoje h4{margin:0 0 2px;font-family:var(--f-px);font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--suave)}
.alerta{color:var(--laranja)}
.config{display:flex;flex-direction:column;gap:10px;margin-top:12px;padding-top:10px;border-top:3px dashed var(--luz)}
.seg{display:inline-flex;border:3px solid var(--borda)}
.seg button{font-family:var(--f-px);background:var(--painel2);border:0;padding:4px 10px;font-size:15px;color:var(--suave)}
.seg button+button{border-left:3px solid var(--borda)}
.seg button[aria-pressed="true"]{background:var(--ouro);color:var(--ouro-esc);font-weight:700}
.linha-config{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.linha-config .nota{flex-basis:100%;font-size:14px;color:var(--suave)}
/* Ficha */
.ficha{padding:12px;display:flex;flex-direction:column;gap:12px}
.ficha h3{margin:0 0 6px;font-family:var(--f-px);font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--suave)}
.hab{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:15px;margin-bottom:6px}
.hab b{font-family:var(--f-px)}
.hab .mini{grid-column:1/-1;height:10px;border:2px solid var(--borda);background:#0d0a1a}
.hab .mini i{display:block;height:100%;background:linear-gradient(var(--azul),#3e8fc8)}
.hab small{grid-column:1/-1;color:var(--suave);font-size:13px}
.perk{font-size:13px;color:var(--verde)}
.pessoa{display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:center;font-size:15px;margin-bottom:6px}
.pessoa img{width:40px;height:40px;image-rendering:pixelated;border:2px solid var(--borda)}
.pessoa small{display:block;color:var(--suave);font-size:13px}
.dica-geral{font-size:14px;color:var(--suave);margin:0}
/* Modais e menus */
.veu{position:fixed;inset:0;background:rgba(5,3,12,.8);display:flex;align-items:center;justify-content:center;z-index:30;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.veu.titulo{background:rgba(5,3,12,.55)}
.modal{width:100%;max-width:640px;max-height:100%;overflow:auto;padding:18px}
.modal .sobre{font-family:var(--f-px);font-size:14px;text-transform:uppercase;letter-spacing:.1em;color:var(--ouro)}
.modal h2{font-family:var(--f-tit);font-size:17px;line-height:1.45;margin:8px 0 12px;text-wrap:balance;text-shadow:2px 2px 0 var(--borda)}
.modal h4{font-family:var(--f-px);font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--suave);margin:16px 0 6px}
.modal p{margin:0 0 10px;max-width:64ch}
.fala{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:start;background:var(--painel3);border:3px solid var(--borda);padding:8px;margin:8px 0}
.contexto{color:var(--azul);font-size:15px;border-left:4px solid var(--azul);padding-left:8px}
.escolhas{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.escolha{text-align:left;background:linear-gradient(var(--painel2),#272148);border:3px solid var(--borda);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35);padding:9px 12px;display:flex;flex-direction:column;gap:2px}
.escolha:hover:not(:disabled){filter:brightness(1.18)}
.escolha:disabled{opacity:.45;cursor:not-allowed}
.escolha b{font-family:var(--f-px);font-size:17px}
.escolha span{font-size:15px;color:var(--suave)}
.escolha .tags{font-size:14px;color:var(--azul)}
.escolha .req{color:var(--vermelho)}
.rodape{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
table.contas{width:100%;border-collapse:collapse;font-size:16px}
table.contas td{padding:5px 0;border-bottom:2px dashed var(--luz)}
table.contas td:last-child{text-align:right;font-family:var(--f-px);font-variant-numeric:tabular-nums}
table.contas tr.total td{font-weight:700;border-bottom:0;padding-top:8px}
.diario{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.diario li{background:var(--painel3);border:2px solid var(--borda);padding:6px 10px;font-size:15px}
.diario .dia{font-family:var(--f-px);color:var(--ouro);margin-right:6px}
.diario .causa{display:block;font-size:14px;color:var(--suave);margin-top:2px}
.diario .causa::before{content:"↳ por causa disto: "}
.compra{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;padding:7px 0;border-bottom:2px dashed var(--luz)}
.compra small{display:block;color:var(--suave);font-size:14px}
.qtd{display:flex;align-items:center;gap:6px;font-family:var(--f-px)}
.qtd button{width:32px;height:32px;padding:0}
.estrelas{font-family:var(--f-tit);font-size:34px;letter-spacing:8px;text-align:center;margin:6px 0 10px}
.estrelas .on{color:var(--ouro);text-shadow:3px 3px 0 var(--borda),0 0 14px rgba(255,204,77,.6)}
.estrelas .off{color:#3a3360;text-shadow:3px 3px 0 var(--borda)}
.menu-titulo{font-family:var(--f-tit);font-size:clamp(26px,6vw,46px);line-height:1.2;color:var(--ouro);margin:6px 0 4px;text-shadow:4px 4px 0 var(--borda),0 0 24px rgba(255,204,77,.4);text-align:center}
.menu-sub{text-align:center;color:var(--suave);margin:0 0 16px}
.menu-botoes{display:flex;flex-direction:column;gap:10px;max-width:340px;margin:0 auto}
.menu-botoes .bt{width:100%}
.slotsave{display:flex;flex-direction:column;gap:8px}
.slotsave .bt{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:10px}
.slotsave small{font-family:var(--f-txt);font-size:13px;color:var(--suave);font-weight:400}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="hud px">
    <div class="marca">CAFÉ<br>CANTINHO</div>
    <div class="hstat"><div><small>Dia</small><b id="hDia">—</b></div></div>
    <div class="hstat"><img class="ico p" id="icoRel" alt=""><div><small>Hora</small><b id="hHora">—</b></div></div>
    <div class="hstat"><img class="ico p" id="icoMoeda" alt=""><div><small>Caixa</small><b id="hCaixa">—</b></div></div>

function diretor(quando) {
  const ok = e => e.quando === quando && !S.vistos[e.id] && S.dia >= (e.min || 1) && e.cond(S);
  const forc = EV.filter(e => e.forcado && ok(e)), opc = EV.filter(e => !e.forcado && ok(e));
  const out = forc.slice(0, 2);
  if (out.length < 2 && opc.length && Math.random() < 0.8) {
    let pool = opc;
    if (S.tensao >= 3) { const l = opc.filter(e => e.peso === 'leve'); if (l.length) pool = l; }
    else if (S.tensao <= 0) { const p = opc.filter(e => e.peso === 'pesado'); if (p.length) pool = p; }
    out.push(pick(pool));
  }
  out.forEach(e => { S.tensao = Math.max(0, S.tensao + (e.peso === 'pesado' ? 2 : -1)); });
  return out.map(e => e.id);
}

  $('#trabalho').innerHTML = ''; $('#dica').hidden = true; hotspots();
  const ult = maisRecente();
  modal(`<div class="menu-titulo">CAFÉ<br>CANTINHO</div><p class="menu-sub">Um café pequeno. Uma semana. Uma vida inteira pela frente.</p>
    <div class="menu-botoes">
      ${ult ? `<button class="bt ouro grande" id="tCont">Continuar<br><small style="font-family:var(--f-txt);font-size:13px;font-weight:400">${esc(ult.d.resumo)}</small></button>` : ''}
      <button class="bt ${ult ? '' : 'ouro grande'}" id="tNovo">Novo jogo</button>
      <button class="bt" id="tCarregar" ${ult ? '' : 'disabled'}>Carregar</button>
      <button class="bt" id="tSom">Som: ${prefs.som ? 'ligado' : 'desligado'}</button>
      <button class="bt verm" id="tFechar">Fechar</button>
    </div>`, m => {
    const c = m.querySelector('#tCont'); if (c) c.onclick = () => carregar(ult.k);
    m.querySelector('#tNovo').onclick = () => { sfx('porta'); introNovo(); };
    m.querySelector('#tCarregar').onclick = () => telaSlots('carregar', mostraTitulo);
    m.querySelector('#tSom').onclick = () => { prefs.som = !prefs.som; salvaPrefs(); sfx('clique'); mostraTitulo(); };
    m.querySelector('#tFechar').onclick = telaFechado;
  }, 'titulo');
}
function introNovo() {
  modal(`<div class="sobre">Novo jogo</div><h2>A chave do café</h2>
    <div class="fala"><img class="retrato" src="${retrato('cida')}" alt=""><div><div class="quem">Dona Cida</div>Trinta anos atrás desse balcão. Agora é tua vez. Tu me pagou a entrada, e a primeira parcela de <b style="color:var(--ouro)">R$ 300</b> fica pra sexta. Amanhã eu fico contigo e te mostro tudo.</div></div>
    <p>Tu comprou o café da Dona Cida com quase tudo o que tinha. Sobraram R$ 300. Cinco dias para pagar a parcela, conquistar o bairro e não perder a própria vida no processo.</p>
    <div class="rodape"><button class="bt" id="iVolta">Voltar</button><button class="bt ouro grande" id="iBora">Começar</button></div>`, m => {
    m.querySelector('#iVolta').onclick = mostraTitulo;
    m.querySelector('#iBora').onclick = () => { S = novoEstado(); iniciarDia(); };
  });
}

/* ================= FLUXO DO DIA ================= */
function iniciarDia() {
  fechaModal();
  S.mods = S.amanha || {}; S.amanha = {};
  if (S.dia === 5 && S.flags.showCaio) S.mods.showCaio = true;
  if (S.dia === 5 && S.flags.caioNoRafa) S.mods.caioNoRafa = true;
  S.fase = 'manha'; S.horas = 3; S.local = 'cafe'; ultimaMsg = null;
  S.agenda = S.agenda.filter(a => { if (a.dia > S.dia) return true; if (a.id === 'bia_demissao' && !(biaAtiva() && S.bia.estresse >= 45)) { diario('A Bia aguentou até o fim da semana.', 'bia_aguenta'); return false; } return a.dia === S.dia; });
  S.snap = { rep: S.rep, caixa: S.caixa, lucia: S.lucia.afin, caio: S.caio.afin, bia: S.bia.estresse, rafa: S.rafa.afin, an: S.animo, nd: S.diario.length };
  S.caio.viuHoje = false; S.compras = 0; S.flags.entregouRafa = false;
  R = null;
  if (S.rafa.acordo) {
    if (S.estoque.massa >= 8) { S.estoque.massa -= 8; S.horas -= 1; S.flags.entregouRafa = true; }
    else { S.rafa.acordo = null; S.rafa.afin -= 15; diario('Faltou massa para a entrega do Rafa. Ele cancelou o acordo.', 'acordo_rafa'); }
  }
  fila = diretor('manha');
  hudSig = '';
  mostraLocal(S.flags.entregouRafa ? 'Uma hora já foi: entreguei os 8 pães do Rafa.' : null);
  proximoEvento(() => { S.metas = gerarMetas(); fechaModal(); autosave(); mostraLocal(); });
}
function fimExpediente() {
  R.rodando = false; S.fase = 'pos'; trava = true; normaliza(); hudSig = '';
  const st = R.stats; S.ultimo = { ...st, biaTrab: R.biaTrab, maxCombo: R.maxCombo };
  S.ontem = { ...st.usou };
  for (const m of S.metas) if (m.fim && !m.ok && m.id === 'semIrritado' && st.irritados === 0) concluiMeta(m);
  const estrelas = S.metas.filter(m => m.ok).length;
  S.estrelasDia[S.dia - 1] = estrelas;
  const sobra = R.vitrine;
  if (sobra > 0) diario(`Sobraram ${sobra} pães de queijo na vitrine. Foram para o lixo.`);
  const [c0, a0] = R.nivIni;
  if (nCoz() > c0) for (let n = c0 + 1; n <= nCoz(); n++) if (n <= 2) S.perkFila.push('coz' + n);
  if (nAtend() > a0) for (let n = a0 + 1; n <= nAtend(); n++) if (n <= 2) S.perkFila.push('at' + n);
  const dRep = S.rep - S.snap.rep;
  $('#dica').hidden = true;
  sfx(estrelas >= 2 ? 'meta' : 'pronto');
  modal(`<div class="sobre">Dia ${S.dia} · 17h</div><h2>Placa virada</h2>
    <div class="estrelas">${[0, 1, 2].map(i => `<span class="${i < estrelas ? 'on' : 'off'}">★</span>`).join('')}</div>
    <table class="contas">
      ${S.metas.map(m => `<tr><td>${m.ok ? '★' : '☆'} ${esc(m.txt)}</td><td class="${m.ok ? 'pos' : ''}">${m.ok ? '+' + brl(m.rec) : '—'}</td></tr>`).join('')}
      <tr><td>Clientes atendidos</td><td>${st.atendidos}</td></tr>
      <tr><td>Foram embora irritados</td><td class="${st.irritados ? 'neg' : ''}">${st.irritados}</td></tr>
      <tr><td>Itens no ponto perfeito</td><td>${st.perfeitos}</td></tr>
      <tr><td>Maior combo</td><td>x${R.maxCombo}</td></tr>
      <tr><td>Vendas</td><td class="pos">${brl(st.receita)}</td></tr>
      <tr><td>Gorjetas</td><td class="pos">${brl(st.gorjeta)}</td></tr>
      ${sobra ? `<tr><td>Pães que sobraram</td><td class="neg">${sobra}</td></tr>` : ''}
      <tr class="total"><td>Fama</td><td class="${dRep >= 0 ? 'pos' : 'neg'}">${Math.round(S.rep)} (${dRep >= 0 ? '+' : ''}${dRep.toFixed(1)})</td></tr>
    </table>
    ${S.dia === 1 ? `<div class="fala"><img class="retrato" src="${retrato('cida')}" alt=""><div><div class="quem">Dona Cida</div>${estrelas >= 2 ? 'Olha só, levou jeito!' : 'Primeiro dia é assim mesmo.'} Toma a chave. Amanhã é contigo.</div></div>` : ''}
    <div class="rodape"><span style="color:var(--suave)">Energia ${Math.round(S.energia)} · Ânimo ${Math.round(S.animo)}</span><button class="bt ouro" id="bOk">Continuar</button></div>`, m => { m.querySelector('#bOk').onclick = () => {
    sfx('clique');
    if (S.dia === 1) diario('A Dona Cida me passou a chave do café.');
    escolhePerks(() => {
      fila = diretor('pos');
      proximoEvento(() => { fechaModal(); S.fase = 'noite'; S.horas = 4; S.local = 'casa'; R = null; ultimaMsg = null; hudSig = ''; autosave(); mostraLocal(); });
    });
  }; });
}
function dormir() {
  trava = true; S.fase = 'fechamento'; $('#hots').innerHTML = ''; $('#dica').hidden = true;
  const sobraH = S.horas;
  if (S.caio.viuHoje) S.caio.semVer = 0; else { S.caio.semVer++; S.caio.afin -= 3; }
  if (S.flags.promessaCaio === S.dia) { S.flags.promessaCaio = false; S.caio.afin -= 20; S.flags.caioNoRafa = true; lembra('promessa_quebrada', 'tu prometeu ao Caio e não apareceu'); diario('Prometi ao Caio que ia aparecer e não fui. Ele aceitou tocar no Grão Nobre na sexta.', 'promessa_caio'); }
  const sal = S.ultimo && S.ultimo.biaTrab ? salarioBia() : 0;
  const rafa = S.rafa.acordo && S.flags.entregouRafa ? S.rafa.valor : 0;
  S.caixa -= ALUGUEL + sal; S.caixa += rafa;
  const ultimo = S.dia >= DIAS;
  let parcela = 0;
  if (ultimo && S.caixa >= PARCELA) { parcela = PARCELA; S.caixa -= PARCELA; S.flags.parcelaPaga = true; diario('Paguei a primeira parcela à Dona Cida. O café é um pouco mais meu.'); }
  S.energia += 50 + 8 * sobraH;
  if (biaAtiva()) { if (S.mods.biaFolga) S.bia.estresse -= 35; else if (S.ultimo && S.ultimo.biaTrab) S.bia.estresse += S.bia.regime === 'integral' ? 16 : 8; }
  S.tensao = Math.max(0, S.tensao - 1);
  normaliza(); hudSig = '';
  const st = S.ultimo || { receita: 0, gorjeta: 0 }, sn = S.snap;
  const dl = (a, b) => { const d = Math.round(a - b); return d ? `<span class="${d > 0 ? 'pos' : 'neg'}">${d > 0 ? '+' : ''}${d}</span>` : '<span style="color:var(--suave)">=</span>'; };
  const hoje = S.diario.slice(sn.nd);
  const metasRec = S.metas.filter(m => m.ok).reduce((a, m) => a + m.rec, 0);
  const falido = S.caixa < 0 || (ultimo && !S.flags.parcelaPaga);
  modal(`<div class="sobre">Dia ${S.dia} · fechamento</div><h2>${falido ? 'O caixa não fechou' : 'As contas do dia'}</h2>
    <table class="contas">
      <tr><td>Compras e melhorias</td><td class="${S.compras ? 'neg' : ''}">${S.compras ? '−' + brl(S.compras) : brl(0)}</td></tr>
      <tr><td>Vendas e gorjetas</td><td class="pos">+${brl(st.receita + st.gorjeta)}</td></tr>
      ${metasRec ? `<tr><td>Bônus das metas</td><td class="pos">+${brl(metasRec)}</td></tr>` : ''}
      <tr><td>Aluguel</td><td class="neg">−${brl(ALUGUEL)}</td></tr>
      ${sal ? `<tr><td>Salário da Bia</td><td class="neg">−${brl(sal)}</td></tr>` : ''}
      ${rafa ? `<tr><td>Pães para o Grão Nobre</td><td class="pos">+${brl(rafa)}</td></tr>` : ''}
      ${parcela ? `<tr><td>Parcela da Dona Cida</td><td class="neg">−${brl(parcela)}</td></tr>` : ''}
      <tr class="total"><td>Caixa agora</td><td class="${S.caixa < 0 ? 'neg' : ''}">${brl(S.caixa)} ${dl(S.caixa, sn.caixa)}</td></tr>
    </table>
    ${!ultimo && !S.flags.parcelaPaga ? `<p class="${S.caixa >= PARCELA ? 'pos' : 'alerta'}" style="margin-top:8px">${S.caixa >= PARCELA ? 'O dinheiro da parcela já está no caixa.' : `Faltam ${brl(PARCELA - S.caixa)} para a parcela de sexta.`}</p>` : ''}
    <h4>O que mudou hoje</h4>
    <table class="contas">
      <tr><td>Fama</td><td>${Math.round(S.rep)} ${dl(S.rep, sn.rep)}</td></tr>
      <tr><td>Ânimo</td><td>${Math.round(S.animo)} ${dl(S.animo, sn.an)}</td></tr>
      <tr><td>Energia depois de dormir</td><td>${Math.round(S.energia)}</td></tr>
      ${S.flags.luciaAtendida ? `<tr><td>Dona Lúcia</td><td>${relacao(S.lucia.afin)} ${dl(S.lucia.afin, sn.lucia)}</td></tr>` : ''}
      <tr><td>Caio</td><td>${relacao(S.caio.afin)} ${dl(S.caio.afin, sn.caio)}</td></tr>
      ${biaAtiva() ? `<tr><td>Cansaço da Bia</td><td>${Math.round(S.bia.estresse)} ${dl(S.bia.estresse, sn.bia)}</td></tr>` : ''}
      <tr><td>Rafa</td><td>${relacao(S.rafa.afin)} ${dl(S.rafa.afin, sn.rafa)}</td></tr>
    </table>
    ${hoje.length ? `<h4>Diário de hoje</h4>${listaDiario(hoje)}` : ''}
    <div class="rodape"><span></span><button class="bt ouro" id="bOk">${falido ? 'Ver o que acontece' : ultimo ? 'Ver como a semana terminou' : 'Dormir até ' + NOME_DIA[S.dia]}</button></div>`, m => { m.querySelector('#bOk').onclick = () => {
    sfx('clique');
    if (falido) return epilogo(true);
    if (ultimo) return epilogo(false);
    S.dia++; iniciarDia();
  }; });
}
function epilogo(falencia) {
  trava = true; S.fase = 'fim'; hudSig = ''; $('#trabalho').innerHTML = ''; $('#dica').hidden = true; hotspots();
  try { localStorage.removeItem(AUTO_KEY); } catch (e) { /* ok */ }
  sfx(falencia ? 'erro' : 'nivel');
  const id = Object.entries(S.padrao).sort((a, b) => b[1] - a[1])[0];
  const txtId = id[1] === 0 ? 'Tu passou a semana inteira atrás do balcão. Ainda não sabe quem é fora dele.' : { cozinha: 'Tu virou alguém que resolve tudo na bancada. O café tem a tua mão.', social: 'Tu conhece o bairro pelo nome. O café virou ponto de encontro antes de virar negócio.', gestao: 'Tu pensa o café como empresa: margem, processo, concorrência. Falta saber se ele ainda é teu.', descanso: 'Tu aprendeu a parar antes de quebrar. O café cresce devagar, e tu junto.' }[id[0]];
  const L = [];
  if (falencia) L.push(S.caixa < 0 ? `O caixa fechou em ${brl(S.caixa)}. O dono do imóvel não esperou.` : `Na sexta à noite, a Dona Cida veio buscar a parcela. Tinha ${brl(S.caixa)} no caixa. Ela olha a cozinha, as melhorias novas, e suspira: "Assim não dá, meu filho."`);
  else L.push(`Tu pagou a parcela. O café termina a semana com ${brl(S.caixa)} e fama ${Math.round(S.rep)}: ${S.rep >= 60 ? 'virou assunto no bairro' : S.rep >= 40 ? 'já tem gente que volta' : 'ainda é um segredo da rua'}.`);
  if (S.bia.foiRafa || (S.mem.bia_recusada && !S.bia.contratada)) L.push('A Bia serve café do outro lado da rua, no Grão Nobre.');
  else if (biaAtiva()) L.push(S.bia.moral >= 55 ? 'A Bia já fala em "nosso café".' : 'A Bia continua, mas conta as horas.');
  if (S.flags.luciaSumiu) L.push('A Dona Lúcia agora toma café na padaria nova.');
  else if (S.flags.luciaAtendida) L.push(S.lucia.afin >= 45 ? 'A Dona Lúcia tem cadeira cativa perto da janela e fala de ti para meio bairro.' : 'A Dona Lúcia ainda aparece, mas não demora mais no balcão.');
  if (S.flags.showCaio) L.push('O show do Caio lotou o café. Alguém filmou e o vídeo rodou no grupo do bairro.');
  else if (S.flags.caioNoRafa) L.push('O Caio tocou sexta no Grão Nobre. Tu ouviu da calçada.');
  else L.push(S.caio.afin >= 50 ? 'O Caio continua sendo quem tu chama quando o dia dá errado.' : 'O Caio e tu se falam menos. Ninguém decidiu isso.');
  if (S.rafa.acordo) L.push('O Rafa virou cliente e concorrente ao mesmo tempo.');
  const total = S.estrelas, max = DIAS * 3;
  modal(`<div class="sobre">${falencia ? 'Fim, por enquanto' : 'Fim da semana'}</div><h2>${falencia ? 'Não deu desta vez' : 'Sexta, 22h'}</h2>
    <div class="estrelas" style="font-size:22px">${S.estrelasDia.map(e => '★'.repeat(e || 0) + '☆'.repeat(3 - (e || 0))).join(' ')}</div>
    <p style="text-align:center;font-family:var(--f-px);font-size:18px">${total} de ${max} estrelas · maior combo da semana: x${Math.max(S.recorde, S.ultimo ? S.ultimo.maxCombo : 0)}</p>
    ${L.map(l => `<p>${esc(l)}</p>`).join('')}<p><b>${esc(txtId)}</b></p>
    ${falencia ? '<p style="color:var(--suave)">No jogo completo, isso abre o capítulo "Recomeçar": a Dona Cida renegocia, ou o Rafa oferece comprar o ponto.</p>' : '<p style="color:var(--suave)">No jogo completo, aqui começa o capítulo 2: o bairro começa a te conhecer.</p>'}
    <h4>Teu diário</h4>${S.diario.length ? listaDiario(S.diario) : '<p>Nada registrado.</p>'}
    <div class="rodape"><button class="bt" id="bMenuF">Menu principal</button><button class="bt ouro" id="bDeNovo">Jogar de novo</button></div>`, m => {
    m.querySelector('#bDeNovo').onclick = () => { S = novoEstado(); iniciarDia(); };
    m.querySelector('#bMenuF').onclick = mostraTitulo;
  });
}

/* ================= LAÇO ================= */
['icoRel:relogio', 'icoMoeda:moeda', 'icoEstrela:estrela', 'icoRaio:raio', 'icoCor:coracao'].forEach(p => { const [id, n] = p.split(':'); $('#' + id).src = icone(n); });
let ult = performance.now();
function laco(t) {
  const dt = Math.min(0.05, (t - ult) / 1000); ult = t;
  atualizar(dt);
  const ts = t / 1000;
  if (S.fase === 'expediente' && R) { cenaCafe(ts); renderExpediente(); }
  else if (S.fase === 'pos' || S.fase === 'titulo') cenaCafe(ts);
  else cenaRua(ts);
  if (R) S.recorde = Math.max(S.recorde, R.maxCombo || 0);
  hud();
  requestAnimationFrame(laco);
}
mostraTitulo();
requestAnimationFrame(laco);
})();
</script>
