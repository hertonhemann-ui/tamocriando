<title>Café Cantinho</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Press+Start+2P&display=swap">
<style>
/* Layout: HUD de barras no topo (estilo Punch Club), cena em pixel art, painel de trabalho embaixo e ficha do personagem ao lado (embaixo no celular). Visual único: noite roxa de fliperama com ouro de balcão. */
:root{
  --fundo:#15122a; --painel:#241f3d; --painel2:#2f2852; --borda:#0a0814; --luz:#4a4275;
  --texto:#f3eedc; --suave:#aaa3cc; --ouro:#ffcc4d; --ouro-esc:#3a2600;
  --verde:#6fdc8c; --vermelho:#ff6b6b; --azul:#6cc4ff; --rosa:#ff8fc7; --laranja:#ffa24d;
  --f-px:"Pixelify Sans","Courier New",monospace;
  --f-tit:"Press Start 2P","Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--fundo);color:var(--texto);font-family:var(--f-px);font-size:16px;line-height:1.35;
  background-image:radial-gradient(rgba(255,255,255,.03) 1px,transparent 1px);background-size:6px 6px}
*{box-sizing:border-box}
.app{max-width:1240px;margin:0 auto;padding-block:10px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.px{background:var(--painel);border:3px solid var(--borda);box-shadow:inset 0 0 0 2px var(--luz),0 4px 0 var(--borda)}
button{font:inherit;color:inherit;cursor:pointer}
.bt{background:var(--painel2);border:3px solid var(--borda);box-shadow:inset 0 -3px 0 rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.12);padding:6px 12px;font-size:15px;font-weight:600;letter-spacing:.02em}
.bt:hover:not(:disabled){filter:brightness(1.15)}
.bt:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.4)}
.bt:disabled{opacity:.4;cursor:not-allowed}
.bt:focus-visible,.ticket:focus-visible,.hot:focus-visible,.acao:focus-visible,.escolha:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}
.bt.ouro{background:var(--ouro);color:var(--ouro-esc)}
.bt.verde{background:var(--verde);color:#0d2a16}
.tecla{font-size:11px;opacity:.75;margin-left:6px;font-weight:400}
/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 14px}
.marca{font-family:var(--f-tit);font-size:13px;color:var(--ouro);line-height:1.4;margin-right:auto;text-shadow:2px 2px 0 var(--borda)}
.hstat{display:flex;flex-direction:column;line-height:1.1;min-width:58px}
.hstat small{font-size:12px;color:var(--suave);text-transform:uppercase;letter-spacing:.06em}
.hstat b{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.barras{display:flex;gap:14px;flex-wrap:wrap}
.barra-rot{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--suave);text-transform:uppercase;letter-spacing:.05em}
.barra{width:120px;height:16px;border:3px solid var(--borda);background:#110e20;position:relative}
.barra i{position:absolute;inset:0 auto 0 0;display:block;transition:width .25s steps(6)}
.barra i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(0,0,0,.35) 9px 10px)}
.ico{width:16px;height:16px;flex:none}
/* Grade principal */
.grade{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:10px;align-items:start}
@media (max-width:980px){.grade{grid-template-columns:minmax(0,1fr)}}
.coluna{display:flex;flex-direction:column;gap:10px;min-width:0}
.cena-wrap{position:relative;padding:0;overflow:hidden}
canvas#cena{display:block;width:100%;aspect-ratio:320/130;image-rendering:pixelated;background:#000}
.hot{position:absolute;bottom:4%;transform:translateX(-50%);background:var(--painel);border:3px solid var(--borda);box-shadow:inset 0 -3px 0 rgba(0,0,0,.4);padding:3px 8px;font-size:clamp(11px,1.5vw,14px);font-weight:600;white-space:nowrap}
.hot.ativo{background:var(--ouro);color:var(--ouro-esc)}
.hot:disabled{opacity:.35;cursor:not-allowed}
.hot .novo{color:var(--verde);margin-left:4px}
.hot.ativo .novo{color:#1f5a2a}
.dialogo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:10px 12px}
.retrato{width:64px;height:64px;image-rendering:pixelated;border:3px solid var(--borda);background:#110e20}
.dialogo .quem{font-weight:700;color:var(--ouro);margin-bottom:2px}
.dialogo p{margin:0 0 6px;max-width:68ch}
.dialogo .acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
/* Expediente */
.trab{padding:10px;display:flex;flex-direction:column;gap:10px}
.rotulo{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--suave);margin:0 0 6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tickets{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:700px){.tickets{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ticket{background:#f3eedc;color:#231a10;border:3px solid var(--borda);box-shadow:0 3px 0 var(--borda);padding:6px 6px 8px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px;position:relative}
.ticket:hover:not(:disabled){background:#fff7d6}
.ticket.vazio{background:transparent;border-style:dashed;border-color:var(--luz);box-shadow:none;color:var(--suave);align-items:center;justify-content:center;font-size:13px}
.ticket .nome{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticket .itens{display:flex;gap:4px;flex-wrap:wrap}
.it{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:1px 4px;border:2px solid #231a10;background:#fff}
.it.ok{background:#bff0c9;text-decoration:line-through}
.it.tem{background:#ffe08a}
.pac{height:8px;border:2px solid #231a10;background:#ddd;margin-top:auto}
.pac i{display:block;height:100%}
.ticket .tag{position:absolute;top:-10px;right:4px;background:var(--rosa);color:#2a0a1a;font-size:11px;padding:0 4px;border:2px solid var(--borda)}
.bancada{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:10px}
@media (max-width:760px){.bancada{grid-template-columns:minmax(0,1fr)}}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.slot{background:var(--painel2);border:3px solid var(--borda);padding:8px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.slot h5{margin:0;font-size:13px;color:var(--suave);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between}
.slot .rec{font-size:17px;font-weight:700}
.etapas{display:flex;flex-wrap:wrap;gap:4px}
.etapa{font-size:12px;padding:1px 5px;border:2px solid var(--borda);background:#1a1630;color:var(--suave)}
.etapa.feita{background:#244a32;color:var(--verde)}
.etapa.atual{background:var(--ouro);color:var(--ouro-esc);font-weight:700}
.prog{height:10px;border:2px solid var(--borda);background:#110e20}
.prog i{display:block;height:100%;background:var(--azul);width:0}
.slotbt{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center}
.estado{font-size:13px;color:var(--suave)}
.lado{display:flex;flex-direction:column;gap:8px}
.caixa-lado{background:var(--painel2);border:3px solid var(--borda);padding:8px;display:flex;flex-direction:column;gap:6px}
.bandeja{display:flex;gap:8px;flex-wrap:wrap}
.cel{width:72px;height:54px;border:3px solid var(--borda);background:#5a3a22;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-size:12px}
.cel.vazia{background:#2a1d12;color:#7a6a5a}
.cel .x{position:absolute;top:-9px;right:-9px;width:22px;height:22px;padding:0;line-height:15px;font-size:14px;background:var(--vermelho);color:#2a0606;border:2px solid var(--borda)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.kv b{font-variant-numeric:tabular-nums}
.neg{color:var(--vermelho)} .pos{color:var(--verde)}
.alvo{animation:pisca .9s steps(2) infinite;outline:4px solid var(--ouro)!important;outline-offset:2px;position:relative;z-index:2}
@keyframes pisca{50%{outline-color:transparent}}
/* Mapa */
.local{padding:12px;display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:12px}
@media (max-width:760px){.local{grid-template-columns:minmax(0,1fr)}}
.local h2{font-family:var(--f-tit);font-size:15px;line-height:1.4;color:var(--ouro);margin:0 0 6px;text-shadow:2px 2px 0 var(--borda)}
.local .desc{color:var(--suave);margin:0 0 10px;font-size:15px}
.acoes-lista{display:flex;flex-direction:column;gap:8px}
.acao{background:var(--painel2);border:3px solid var(--borda);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35);padding:8px 10px;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.acao:hover:not(:disabled){filter:brightness(1.15)}
.acao:disabled{opacity:.45;cursor:not-allowed}
.acao b{font-size:16px}
.acao .hr{grid-row:span 2;font-size:15px;font-weight:700;background:var(--borda);color:var(--ouro);padding:3px 7px}
.efs{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px}
.ef-up{color:var(--verde)} .ef-dn{color:var(--vermelho)} .ef-nt{color:var(--suave)}
.req{font-size:13px;color:var(--vermelho);grid-column:1/-1}
.hoje{background:#1a1630;border:3px solid var(--borda);padding:10px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.hoje h4{margin:0 0 2px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--suave)}
.alerta{color:var(--laranja)}
.config{display:flex;flex-direction:column;gap:10px;margin-top:12px;padding-top:10px;border-top:3px dashed var(--luz)}
.seg{display:inline-flex;border:3px solid var(--borda)}
.seg button{background:var(--painel2);border:0;padding:4px 10px;font-size:14px;color:var(--suave)}
.seg button+button{border-left:3px solid var(--borda)}
.seg button[aria-pressed="true"]{background:var(--ouro);color:var(--ouro-esc);font-weight:700}
.linha-config{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px}
.linha-config .nota{flex-basis:100%;font-size:13px;color:var(--suave)}
/* Ficha */
.ficha{padding:12px;display:flex;flex-direction:column;gap:12px}
.ficha h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--suave)}
.hab{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:14px;margin-bottom:6px}
.hab .mini{grid-column:1/-1;height:8px;border:2px solid var(--borda);background:#110e20}
.hab .mini i{display:block;height:100%;background:var(--azul)}
.hab small{grid-column:1/-1;color:var(--suave);font-size:12px}
.pessoa{display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:center;font-size:14px;margin-bottom:6px}
.pessoa img{width:36px;height:36px;image-rendering:pixelated;border:2px solid var(--borda)}
.pessoa small{display:block;color:var(--suave);font-size:12px}
.dica-geral{font-size:13px;color:var(--suave);margin:0}
/* Modais */
.veu{position:fixed;inset:0;background:rgba(6,4,14,.78);display:flex;align-items:center;justify-content:center;z-index:30;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{width:100%;max-width:620px;max-height:100%;overflow:auto;padding:18px}
.modal .sobre{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--ouro)}
.modal h2{font-family:var(--f-tit);font-size:17px;line-height:1.45;margin:8px 0 12px;text-wrap:balance;text-shadow:2px 2px 0 var(--borda)}
.modal h4{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--suave);margin:16px 0 6px}
.modal p{margin:0 0 10px;max-width:64ch}
.fala{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:start;background:#1a1630;border:3px solid var(--borda);padding:8px;margin:8px 0}
.fala .quem{font-weight:700;color:var(--ouro)}
.contexto{color:var(--azul);font-size:14px;border-left:4px solid var(--azul);padding-left:8px}
.escolhas{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.escolha{text-align:left;background:var(--painel2);border:3px solid var(--borda);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35);padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.escolha:hover:not(:disabled){filter:brightness(1.15)}
.escolha:disabled{opacity:.45;cursor:not-allowed}
.escolha b{font-size:16px}
.escolha span{font-size:14px;color:var(--suave)}
.escolha .tags{font-size:13px;color:var(--azul)}
.escolha .req{color:var(--vermelho)}
.rodape{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
table.contas{width:100%;border-collapse:collapse;font-size:15px}
table.contas td{padding:4px 0;border-bottom:2px dashed var(--luz)}
table.contas td:last-child{text-align:right;font-variant-numeric:tabular-nums}
table.contas tr.total td{font-weight:700;border-bottom:0;padding-top:8px}
.diario{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.diario li{background:#1a1630;border:2px solid var(--borda);padding:6px 10px;font-size:14px}
.diario .dia{color:var(--ouro);margin-right:6px}
.diario .causa{display:block;font-size:13px;color:var(--suave);margin-top:2px}
.diario .causa::before{content:"↳ por causa disto: "}
.compra{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;padding:6px 0;border-bottom:2px dashed var(--luz);font-size:15px}
.compra small{display:block;color:var(--suave);font-size:13px}
.qtd{display:flex;align-items:center;gap:6px}
.qtd button{width:30px;height:30px;padding:0}
.titulo-jogo{font-family:var(--f-tit);font-size:clamp(24px,6vw,38px);line-height:1.25;color:var(--ouro);margin:10px 0 14px;text-shadow:4px 4px 0 var(--borda)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="hud px">
    <div class="marca">CAFÉ<br>CANTINHO</div>
    <div class="hstat"><small>Dia</small><b id="hDia">—</b></div>
    <div class="hstat"><small>Hora</small><b id="hHora">—</b></div>
    <div class="hstat"><small>Caixa</small><b id="hCaixa">—</b></div>
    <div class="hstat"><small>Fama</small><b id="hRep">—</b></div>
    <div class="barras">
      <div class="barra-rot"><svg class="ico" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="#ffcc4d" d="M4 0h2v1H5v2h2v1H6v1H5v1H4v1H3v1H2V6h1V5H1V4h1V3h1V2h1z"/></svg>Energia<div class="barra"><i id="bEnergia"></i></div></div>
      <div class="barra-rot"><svg class="ico" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="#ff8fc7" d="M1 1h2v1h2V1h2v1h1v2H7v1H6v1H5v1H3V6H2V5H1V4H0V2h1z"/></svg>Ânimo<div class="barra"><i id="bAnimo"></i></div></div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="bt" id="bPausa" hidden>Pausar</button>
      <button class="bt" id="bDiario">Diário</button>
      <button class="bt ouro" id="bFase" hidden></button>
    </div>
  </header>
  <div class="grade">
    <div class="coluna">
      <div class="cena-wrap px"><canvas id="cena" width="320" height="130" aria-label="Cena do jogo"></canvas><div id="hots"></div></div>
      <div class="dialogo px" id="dica" hidden></div>
      <div class="px" id="trabalho"></div>
    </div>
    <aside class="ficha px" id="ficha"></aside>
  </div>
</div>
<div class="veu" id="veu" hidden><div class="modal px" id="modal" role="dialog" aria-modal="true"></div></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#cena'), cx = cv.getContext('2d');
const CW = 320, CH = 130;

/* ================= DADOS ================= */
const DAY_LEN = 180, GRACE = 25, DIAS = 5;
const NOME_DIA = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta'];
const RECEITAS = {
  espresso: { nome: 'Espresso', usa: { grao: 1 }, passos: [{ id: 'moer', nome: 'Moer', tipo: 'mao', t: 1.2 }, { id: 'extrair', nome: 'Extrair', tipo: 'maq', t: 3 }] },
  cappuccino: { nome: 'Cappuccino', usa: { grao: 1, leite: 1 }, passos: [{ id: 'moer', nome: 'Moer', tipo: 'mao', t: 1.2 }, { id: 'extrair', nome: 'Extrair', tipo: 'maq', t: 3 }, { id: 'vaporizar', nome: 'Vaporizar leite', tipo: 'mao', t: 1.5 }] },
};
const PRECO_BASE = { espresso: 6, cappuccino: 9, pao: 5 };
const ITEM_CURTO = { espresso: 'Espresso', cappuccino: 'Cappuccino', pao: 'Pão' };
const PRECO_MULT = { baixo: 0.8, normal: 1, alto: 1.25 };
const DEMANDA_PRECO = { baixo: 1.2, normal: 1, alto: 0.8 };
const PAC_PRECO = { baixo: 1.1, normal: 1, alto: 0.85 };
const ALUGUEL = 40;
const SAL = { integral: 35, meio: 20 };
const FORNO_T = 8;
const PACOTES = {

  leite: { nome: 'Leite', qtd: 10, preco: 14, un: 'doses' },
  massa: { nome: 'Massa de pão de queijo', qtd: 12, preco: 9, un: 'unid.' },
};
const MELHORIAS = [
  { id: 'slot3', nome: 'Terceiro espaço de preparo', preco: 90, desc: 'Mais um pedido em andamento ao mesmo tempo.', req: s => s.up.slots === 2, ef: s => { s.up.slots = 3; } },
  { id: 'slot4', nome: 'Quarto espaço de preparo', preco: 150, desc: 'Quatro pedidos em paralelo.', req: s => s.up.slots === 3, ef: s => { s.up.slots = 4; } },
  { id: 'maq2', nome: 'Máquina de dois grupos', preco: 140, desc: 'Extrai dois cafés ao mesmo tempo. Hoje a máquina é o gargalo.', req: s => s.up.maquina === 1, ef: s => { s.up.maquina = 2; } },
  { id: 'moedor', nome: 'Moedor elétrico', preco: 70, desc: 'Moer leva metade do tempo. Tuas mãos ficam livres antes.', req: s => !s.up.moedor, ef: s => { s.up.moedor = true; } },

  { id: 'forno', nome: 'Forno grande', preco: 80, desc: 'Assa 8 pães de cada vez em vez de 4.', req: s => s.up.forno === 4, ef: s => { s.up.forno = 8; } },
];
const NOMES = ['Seu Jair', 'Marina', 'Tonho', 'Rita', 'Juca', 'Paula', 'Beto', 'Dani', 'Lu', 'Seu Zé', 'Carla', 'Nando', 'Tati', 'Gui', 'Neide', 'Raul', 'Bruna', 'Seu Lino', 'Mel', 'Edu', 'Kátia', 'Vini', 'Duda', 'Sônia', 'Léo', 'Ivone', 'Josi', 'Seu Abel'];
const PERS = {
  voce: { nome: 'Tu', pele: '#e0a878', cabelo: '#3a2416', roupa: '#ffcc4d', estilo: 'curto' },
  cida: { nome: 'Dona Cida', pele: '#d9a07a', cabelo: '#ece8f4', roupa: '#c0392b', estilo: 'coque' },
  bia: { nome: 'Bia', pele: '#c98a5e', cabelo: '#5a2e18', roupa: '#2f8f6f', estilo: 'rabo' },
  lucia: { nome: 'Dona Lúcia', pele: '#efc6a6', cabelo: '#c3b0de', roupa: '#8e5ca8', estilo: 'curto', oculos: true },
  caio: { nome: 'Caio', pele: '#8d5a3b', cabelo: '#1c1c1c', roupa: '#3d6fd1', estilo: 'bone' },
  rafa: { nome: 'Rafa', pele: '#e6b48f', cabelo: '#141414', roupa: '#1f5f4a', estilo: 'topete' },
  blog: { nome: 'Blogueira', pele: '#f1c9a5', cabelo: '#d2483a', roupa: '#222222', estilo: 'longo' },
  dimas: { nome: 'Seu Dimas', pele: '#b07850', cabelo: '#777777', roupa: '#7a5a3a', estilo: 'careca' },

    const tem = ACOES.some(a => a.local === id && (a.fase === fase || a.fase === 'ambas'));

    const novo = (id === 'fornecedor' && S.dia === 2 && fase === 'manha') || (id === 'cafe' && S.dia === 3 && fase === 'manha');
    return `<button class="hot ${S.local === id ? 'ativo' : ''}" data-local="${id}" style="left:${L.x / CW * 100}%" ${trancado ? 'disabled' : ''}>${L.nome}${novo ? '<span class="novo">novo</span>' : ''}</button>`;

}

function acaoMapa(b) {

function mostraCompras() {

  const desc = 1 - 0.05 * S.hab.gestao;

  const total = () => Object.keys(q).reduce((a, k) => a + q[k] * pp(k), 0) + [...ups].reduce((a, id) => a + MELHORIAS.find(m => m.id === id).preco, 0);

  const draw = () => {
    const disp = MELHORIAS.filter(m => m.req(S));
    modal(`<div class="sobre">Fornecedor · gasta 1 hora</div><h2>Seu Dimas</h2>
      <div class="fala"><img class="retrato" src="${retrato('dimas')}" alt=""><div><div class="quem">Seu Dimas</div>Pra uns ${n} clientes tu vai precisar de uns ${nec.grao} de grão, ${nec.leite} de leite e ${nec.pao} pães.${S.hab.gestao ? ` Pra ti, ${S.hab.gestao * 5}% de desconto.` : ''}</div></div>

      <h4>Melhorias usadas</h4>
      ${disp.length ? disp.map(m => `<div class="compra"><div>${m.nome}<small>${m.desc}</small></div><button class="bt ${ups.has(m.id) ? 'verde' : ''}" data-up="${m.id}">${ups.has(m.id) ? 'no carrinho' : 'quero'}</button><b>${brl(m.preco)}</b></div>`).join('') : '<p>Tu já comprou tudo o que ele tinha.</p>'}
      <table class="contas" style="margin-top:10px"><tr class="total"><td>Total (caixa ${brl(S.caixa)})</td><td class="${total() > S.caixa ? 'neg' : ''}">${brl(total())}</td></tr></table>
      <div class="rodape"><button class="bt" id="bVolta">Voltar sem comprar</button><button class="bt ouro" id="bCompra" ${total() > S.caixa || total() === 0 ? 'disabled' : ''}>Comprar (gasta 1h)</button></div>`, m => {
      m.querySelectorAll('[data-k]').forEach(b => { b.onclick = () => { q[b.dataset.k] = Math.max(0, q[b.dataset.k] + +b.dataset.d); draw(); }; });

}

}

/* ================= FLUXO ================= */
function salvar() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* sem armazenamento */ } }
function mostraTitulo() {
  S.fase = 'titulo'; trava = false; R = null; hudSig = '';
  $('#trabalho').innerHTML = ''; $('#dica').hidden = true; hotspots();
  let salvo = null; try { salvo = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { salvo = null; }
  modal(`<div class="sobre">Protótipo jogável · 5 dias</div><div class="titulo-jogo">CAFÉ<br>CANTINHO</div>
    <div class="fala"><img class="retrato" src="${retrato('cida')}" alt=""><div><div class="quem">Dona Cida</div>Trinta anos atrás desse balcão. Agora é tua vez. Amanhã eu fico contigo e te mostro tudo. Depois disso, o café é teu.</div></div>
    <p>Tu comprou o café da Dona Cida com quase tudo o que tinha. Sobraram R$ 300 e cinco dias para provar que dá certo, sem perder a própria vida no processo.</p>
    <div class="rodape">${salvo && salvo.dia ? `<button class="bt" id="bCont">Continuar do dia ${salvo.dia}</button>` : '<span></span>'}<button class="bt ouro" id="bNovo">Começar</button></div>`, m => {
    m.querySelector('#bNovo').onclick = () => { S = novoEstado(); iniciarDia(); };
    const bc = m.querySelector('#bCont'); if (bc) bc.onclick = () => { S = Object.assign(novoEstado(), salvo); iniciarDia(true); };
  });
}
function iniciarDia(continuando) {
  fechaModal();
  if (!continuando) { S.mods = S.amanha || {}; S.amanha = {}; }
  if (S.dia === 5 && S.flags.showCaio) S.mods.showCaio = true;
  if (S.dia === 5 && S.flags.caioNoRafa) S.mods.caioNoRafa = true;
  S.fase = 'manha'; S.horas = 3; S.local = 'cafe'; ultimaMsg = null;
  S.agenda = S.agenda.filter(a => { if (a.dia > S.dia) return true; if (a.id === 'bia_demissao' && !(biaAtiva() && S.bia.estresse >= 45)) { diario('A Bia aguentou até o fim da semana.', 'bia_aguenta'); return false; } return a.dia === S.dia; });
  if (!continuando) salvar();
  S.snap = { rep: S.rep, caixa: S.caixa, lucia: S.lucia.afin, caio: S.caio.afin, bia: S.bia.estresse, rafa: S.rafa.afin, an: S.animo, nd: S.diario.length };
  S.caio.viuHoje = false; S.compras = 0; S.flags.entregouRafa = false;
  R = null;
  if (S.rafa.acordo) {
    if (S.estoque.massa >= 8) { S.estoque.massa -= 8; S.horas -= 1; S.flags.entregouRafa = true; }
    else { S.rafa.acordo = null; S.rafa.afin -= 15; diario('Faltou massa para a entrega do Rafa. Ele cancelou o acordo.', 'acordo_rafa'); }
  }
  fila = diretor('manha');
  hudSig = '';
  mostraLocal(S.flags.entregouRafa ? 'Uma hora já foi: entreguei os 8 pães do Rafa.' : null);
  proximoEvento(() => { fechaModal(); mostraLocal(); });
}
function fimExpediente() {
  R.rodando = false; S.fase = 'pos'; trava = true; normaliza(); hudSig = '';
  const st = R.stats; S.ultimo = { ...st, biaTrab: R.biaTrab };
  S.ontem = { ...st.usou };
  const sobra = R.vitrine;
  if (sobra > 0) diario(`Sobraram ${sobra} pães de queijo na vitrine. Foram para o lixo.`);
  const dRep = S.rep - S.snap.rep;
  $('#dica').hidden = true;
  modal(`<div class="sobre">Dia ${S.dia} · 17h</div><h2>Placa virada</h2>
    <table class="contas">
      <tr><td>Clientes atendidos</td><td>${st.atendidos}</td></tr>
      <tr><td>Foram embora irritados</td><td class="${st.irritados ? 'neg' : ''}">${st.irritados}</td></tr>
      <tr><td>Desistiram na porta</td><td class="${st.recusados ? 'neg' : ''}">${st.recusados}</td></tr>
      <tr><td>Vendas</td><td class="pos">${brl(st.receita)}</td></tr>
      <tr><td>Gorjetas</td><td class="pos">${brl(st.gorjeta)}</td></tr>
      ${sobra ? `<tr><td>Pães que sobraram</td><td class="neg">${sobra}</td></tr>` : ''}
      <tr class="total"><td>Fama</td><td class="${dRep >= 0 ? 'pos' : 'neg'}">${Math.round(S.rep)} (${dRep >= 0 ? '+' : ''}${dRep.toFixed(1)})</td></tr>
    </table>
    ${S.dia === 1 ? `<div class="fala"><img class="retrato" src="${retrato('cida')}" alt=""><div><div class="quem">Dona Cida</div>Primeiro dia é assim mesmo. Toma a chave. Amanhã é contigo.</div></div>` : ''}
    <div class="rodape"><span style="color:var(--suave)">Energia ${Math.round(S.energia)} · Ânimo ${Math.round(S.animo)}</span><button class="bt ouro" id="bOk">Continuar</button></div>`, m => { m.querySelector('#bOk').onclick = () => {
    if (S.dia === 1) diario('A Dona Cida me passou a chave do café.');
    fila = diretor('pos');
    proximoEvento(() => { fechaModal(); S.fase = 'noite'; S.horas = 4; S.local = 'casa'; R = null; ultimaMsg = null; hudSig = ''; mostraLocal(); });
  }; });
}
function dormir() {
  trava = true; S.fase = 'fechamento'; $('#hots').innerHTML = ''; $('#dica').hidden = true;
  const sobraH = S.horas;
  if (S.caio.viuHoje) S.caio.semVer = 0; else { S.caio.semVer++; S.caio.afin -= 3; }
  if (S.flags.promessaCaio === S.dia) { S.flags.promessaCaio = false; S.caio.afin -= 20; S.flags.caioNoRafa = true; lembra('promessa_quebrada', 'tu prometeu ao Caio e não apareceu'); diario('Prometi ao Caio que ia aparecer e não fui. Ele aceitou tocar no Grão Nobre na sexta.', 'promessa_caio'); }
  const sal = S.ultimo && S.ultimo.biaTrab ? salarioBia() : 0;
  const rafa = S.rafa.acordo && S.flags.entregouRafa ? S.rafa.valor : 0;
  S.caixa -= ALUGUEL + sal; S.caixa += rafa;
  S.energia += 50 + 8 * sobraH;
  if (biaAtiva()) { if (S.mods.biaFolga) S.bia.estresse -= 35; else if (S.ultimo && S.ultimo.biaTrab) S.bia.estresse += S.bia.regime === 'integral' ? 16 : 8; }
  S.tensao = Math.max(0, S.tensao - 1);
  normaliza(); hudSig = '';
  const st = S.ultimo || { receita: 0, gorjeta: 0 }, sn = S.snap;
  const dl = (a, b) => { const d = Math.round(a - b); return d ? `<span class="${d > 0 ? 'pos' : 'neg'}">${d > 0 ? '+' : ''}${d}</span>` : '<span style="color:var(--suave)">=</span>'; };
  const hoje = S.diario.slice(sn.nd);
  const falido = S.caixa < 0, ultimo = S.dia >= DIAS;
  modal(`<div class="sobre">Dia ${S.dia} · fechamento</div><h2>${falido ? 'O caixa não fechou' : 'As contas do dia'}</h2>
    <table class="contas">
      <tr><td>Compras e melhorias</td><td class="${S.compras ? 'neg' : ''}">${S.compras ? '−' + brl(S.compras) : brl(0)}</td></tr>
      <tr><td>Vendas e gorjetas</td><td class="pos">+${brl(st.receita + st.gorjeta)}</td></tr>
      <tr><td>Aluguel</td><td class="neg">−${brl(ALUGUEL)}</td></tr>
      ${sal ? `<tr><td>Salário da Bia</td><td class="neg">−${brl(sal)}</td></tr>` : ''}
      ${rafa ? `<tr><td>Pães para o Grão Nobre</td><td class="pos">+${brl(rafa)}</td></tr>` : ''}
      <tr class="total"><td>Caixa agora</td><td class="${S.caixa < 0 ? 'neg' : ''}">${brl(S.caixa)} ${dl(S.caixa, sn.caixa)}</td></tr>
    </table>
    <h4>O que mudou hoje</h4>
    <table class="contas">
      <tr><td>Fama</td><td>${Math.round(S.rep)} ${dl(S.rep, sn.rep)}</td></tr>
      <tr><td>Ânimo</td><td>${Math.round(S.animo)} ${dl(S.animo, sn.an)}</td></tr>
      <tr><td>Energia depois de dormir</td><td>${Math.round(S.energia)}</td></tr>
      ${S.flags.luciaAtendida ? `<tr><td>Dona Lúcia</td><td>${relacao(S.lucia.afin)} ${dl(S.lucia.afin, sn.lucia)}</td></tr>` : ''}
      <tr><td>Caio</td><td>${relacao(S.caio.afin)} ${dl(S.caio.afin, sn.caio)}</td></tr>
      ${biaAtiva() ? `<tr><td>Cansaço da Bia</td><td>${Math.round(S.bia.estresse)} ${dl(S.bia.estresse, sn.bia)}</td></tr>` : ''}
      <tr><td>Rafa</td><td>${relacao(S.rafa.afin)} ${dl(S.rafa.afin, sn.rafa)}</td></tr>
    </table>
    ${hoje.length ? `<h4>Diário de hoje</h4>${listaDiario(hoje)}` : ''}
    <div class="rodape"><span></span><button class="bt ouro" id="bOk">${falido ? 'Ver o que acontece' : ultimo ? 'Ver como a semana terminou' : 'Dormir até ' + NOME_DIA[S.dia]}</button></div>`, m => { m.querySelector('#bOk').onclick = () => {
    if (falido) return epilogo(true);
    if (ultimo) return epilogo(false);
    S.dia++; iniciarDia();
  }; });
}
function epilogo(falencia) {
  trava = true; S.fase = 'fim'; hudSig = ''; $('#trabalho').innerHTML = ''; $('#dica').hidden = true; hotspots();
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ok */ }
  const id = Object.entries(S.padrao).sort((a, b) => b[1] - a[1])[0];
  const txtId = id[1] === 0 ? 'Tu passou a semana inteira atrás do balcão. Ainda não sabe quem é fora dele.' : { cozinha: 'Tu virou alguém que resolve tudo na bancada. O café tem a tua mão.', social: 'Tu conhece o bairro pelo nome. O café virou ponto de encontro antes de virar negócio.', gestao: 'Tu pensa o café como empresa: margem, processo, concorrência. Falta saber se ele ainda é teu.', descanso: 'Tu aprendeu a parar antes de quebrar. O café cresce devagar, e tu junto.' }[id[0]];
  const L = [];
  L.push(falencia ? `O caixa fechou em ${brl(S.caixa)}. O dono do imóvel não esperou. Tu devolve a chave que a Dona Cida te deu.` : `O café termina a semana com ${brl(S.caixa)} e fama ${Math.round(S.rep)}: ${S.rep >= 60 ? 'virou assunto no bairro' : S.rep >= 40 ? 'já tem gente que volta' : 'ainda é um segredo da rua'}.`);
  if (S.bia.foiRafa || (S.mem.bia_recusada && !S.bia.contratada)) L.push('A Bia serve café do outro lado da rua, no Grão Nobre.');
  else if (biaAtiva()) L.push(S.bia.moral >= 55 ? 'A Bia já fala em "nosso café".' : 'A Bia continua, mas conta as horas.');
  if (S.flags.luciaSumiu) L.push('A Dona Lúcia agora toma café na padaria nova. Passa pela tua porta sem olhar.');
  else if (S.flags.luciaAtendida) L.push(S.lucia.afin >= 45 ? 'A Dona Lúcia tem cadeira cativa perto da janela e fala de ti para meio bairro.' : 'A Dona Lúcia ainda aparece, mas não demora mais no balcão.');
  if (S.flags.showCaio) L.push('O show do Caio lotou o café. Alguém filmou e o vídeo rodou no grupo do bairro.');
  else if (S.flags.caioNoRafa) L.push('O Caio tocou sexta no Grão Nobre. Tu ouviu da calçada.');
  else L.push(S.caio.afin >= 50 ? 'O Caio continua sendo quem tu chama quando o dia dá errado.' : 'O Caio e tu se falam menos. Ninguém decidiu isso.');
  if (S.rafa.acordo) L.push('O Rafa virou cliente e concorrente ao mesmo tempo.');
  const up = []; if (S.up.slots > 2) up.push(`${S.up.slots} espaços de preparo`); if (S.up.maquina > 1) up.push('máquina de dois grupos'); if (S.up.moedor) up.push('moedor elétrico'); if (S.up.bandeja > 4) up.push('bandeja grande'); if (S.up.forno > 4) up.push('forno grande');
  if (up.length) L.push('A cozinha mudou: ' + up.join(', ') + '.');
  modal(`<div class="sobre">${falencia ? 'Fim, por enquanto' : 'Fim da semana'}</div><h2>${falencia ? 'O café fechou' : 'Sexta, 22h'}</h2>
    ${L.map(l => `<p>${esc(l)}</p>`).join('')}<p><b>${esc(txtId)}</b></p>
    ${falencia ? '<p style="color:var(--suave)">No jogo completo, falir abre o capítulo "Recomeçar", talvez trabalhando para o Rafa.</p>' : ''}
    <h4>Teu diário</h4>${S.diario.length ? listaDiario(S.diario) : '<p>Nada registrado.</p>'}
    <h4>Para o teste</h4><p style="color:var(--suave)">Em que momento tu quis abrir o café de novo? O que travou? Qual escolha pesou?</p>
    <div class="rodape"><span></span><button class="bt ouro" id="bDeNovo">Jogar de novo</button></div>`, m => { m.querySelector('#bDeNovo').onclick = () => { S = novoEstado(); iniciarDia(); }; });
}

/* ================= LAÇO ================= */
let ult = performance.now();
function laco(t) {
  const dt = Math.min(0.05, (t - ult) / 1000); ult = t;
  atualizar(dt);
  const ts = t / 1000;
  if (S.fase === 'expediente' && R) { cenaCafe(ts); renderExpediente(); }
  else if (S.fase === 'pos' || S.fase === 'fechamento') cenaCafe(ts);
  else cenaRua(ts);
  hud();
  requestAnimationFrame(laco);
}
mostraTitulo();
requestAnimationFrame(laco);
})();
</script>
